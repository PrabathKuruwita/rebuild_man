version: "3.8"

services:
  # PostgreSQL Database Only - for development
  db:
    image: postgres:15-alpine
    container_name: rebuild_db
    environment:
      POSTGRES_DB: ${DB_NAME:-rebuild_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password_change_me}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rebuild_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rebuild_network

volumes:
  postgres_data:

networks:
  rebuild_network:
    driver: bridge
