apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-server
  namespace: monitoring
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # Scrape Prometheus itself
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

      # Scrape Kubernetes nodes
      - job_name: node-exporter
        static_configs:
          - targets: ['prometheus-prometheus-node-exporter.monitoring.svc.cluster.local:9100']

      # Scrape Django backend
      - job_name: django-backend
        static_configs:
          - targets: ['backend.rikili001.svc.cluster.local:8000']
        metrics_path: /metrics
        scrape_interval: 30s

      # Scrape kube-state-metrics
      - job_name: kube-state-metrics
        static_configs:
          - targets: ['prometheus-kube-state-metrics.monitoring.svc.cluster.local:8080']
