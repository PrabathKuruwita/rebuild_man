name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  PYTHONUNBUFFERED: "1"
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: rebuild_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Django project
        env:
          SECRET_KEY: test-secret-key
          DB_NAME: rebuild_db
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: localhost
          DB_PORT: 5432
          DEBUG: "True"
        run: python manage.py check

      - name: Run backend tests
        env:
          SECRET_KEY: test-secret-key
          DB_NAME: rebuild_db
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: localhost
          DB_PORT: 5432
          DEBUG: "True"
        run: python manage.py test

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  trivy-vulnerability-scan:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan backend dependencies
        id: backend_vuln_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.22.0
        with:
          scan-type: fs
          scan-ref: backend
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          output: trivy-backend-vulnerabilities.txt

      - name: Scan frontend dependencies
        id: frontend_vuln_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.22.0
        with:
          scan-type: fs
          scan-ref: frontend
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          output: trivy-frontend-vulnerabilities.txt

      - name: Upload vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-vulnerability-reports
          path: |
            trivy-backend-vulnerabilities.txt
            trivy-frontend-vulnerabilities.txt

      - name: Fail when vulnerabilities are found
        if: steps.backend_vuln_scan.outcome == 'failure' || steps.frontend_vuln_scan.outcome == 'failure'
        run: exit 1

  trivy-policy-check:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan infrastructure and Docker policies
        id: policy_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.22.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          output: trivy-policy-report.txt

      - name: Upload policy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-policy-report
          path: trivy-policy-report.txt

      - name: Fail when policy issues are found
        if: steps.policy_scan.outcome == 'failure'
        run: exit 1

  docker-build:
    needs:
      - backend-test
      - frontend-test
      - trivy-vulnerability-scan
      - trivy-policy-check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: rebuild-backend:latest

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: rebuild-frontend:latest

  push-images:
    needs: [docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ravindudilhan
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ravindudilhan/rebuild-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ravindudilhan/rebuild-frontend:latest

  deploy-k3s:
    needs: [push-images]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          KUBECTL_VERSION=$(curl -L -s https://dl.k8s.io/release/stable.txt)
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Configure kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" > ~/.kube/config

      - name: Ensure namespace exists
        run: |
          kubectl create namespace rikili001 --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Kubernetes secrets
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
        run: |
          kubectl create secret generic backend-secrets \
            --from-literal=SECRET_KEY="$DJANGO_SECRET_KEY" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=EMAIL_HOST_USER="$EMAIL_HOST_USER" \
            --from-literal=EMAIL_HOST_PASSWORD="$EMAIL_HOST_PASSWORD" \
            --from-literal=DEFAULT_FROM_EMAIL="$EMAIL_HOST_USER" \
            -n rikili001 \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply PostgreSQL manifests
        run: kubectl apply -f k8s/postgres.yaml

      - name: Apply backend manifests
        run: kubectl apply -f k8s/backend.yaml

      - name: Apply frontend manifests
        run: kubectl apply -f k8s/frontend.yaml

      - name: Apply ingress manifest
        run: kubectl apply -f k8s/ingress.yaml
