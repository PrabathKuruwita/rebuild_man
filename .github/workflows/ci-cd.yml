name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  PYTHONUNBUFFERED: "1"
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: rebuild_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Django project
        env:
          SECRET_KEY: test-secret-key
          DB_NAME: rebuild_db
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: localhost
          DB_PORT: 5432
          DEBUG: "True"
        run: python manage.py check

      - name: Run backend tests
        env:
          SECRET_KEY: test-secret-key
          DB_NAME: rebuild_db
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: localhost
          DB_PORT: 5432
          DEBUG: "True"
        run: python manage.py test

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Audit production frontend dependencies
        run: npm audit --omit=dev --audit-level=high

  trivy-vulnerability-scan:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan backend dependencies
        id: backend_vuln_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.22.0
        with:
          scan-type: fs
          scan-ref: backend
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          output: trivy-backend-vulnerabilities.txt

      - name: Upload vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-vulnerability-reports
          path: |
            trivy-backend-vulnerabilities.txt

      - name: Fail when vulnerabilities are found
        if: steps.backend_vuln_scan.outcome == 'failure'
        run: exit 1

  trivy-policy-check:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan infrastructure and Docker policies
        id: policy_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.22.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          output: trivy-policy-report.txt

      - name: Upload policy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-policy-report
          path: trivy-policy-report.txt

      - name: Fail when policy issues are found
        if: steps.policy_scan.outcome == 'failure'
        run: exit 1

  push-images:
    needs:
      - backend-test
      - frontend-test
      - trivy-vulnerability-scan
      - trivy-policy-check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ravindudilhan
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          provenance: true
          tags: |
            ravindudilhan/rebuild-backend:latest
            ravindudilhan/rebuild-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          provenance: true
          build-args: |
            BACKEND_URL=http://backend:8000
          tags: |
            ravindudilhan/rebuild-frontend:latest
            ravindudilhan/rebuild-frontend:${{ github.sha }}

      - name: Scan published images
        id: frontend_image_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.22.0
        with:
          image-ref: ravindudilhan/rebuild-frontend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-frontend-image.txt
          exit-code: 1

      - name: Scan published backend image
        id: backend_image_scan
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.22.0
        with:
          image-ref: ravindudilhan/rebuild-backend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-backend-image.txt
          exit-code: 1

      - name: Upload image scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-reports-${{ github.sha }}
          path: trivy-*-image.txt
          if-no-files-found: warn

      - name: Fail when published images have vulnerabilities
        if: steps.frontend_image_scan.outcome == 'failure' || steps.backend_image_scan.outcome == 'failure'
        run: exit 1

  deploy-k3s:
    needs: [push-images]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          KUBECTL_VERSION=$(curl -L -s https://dl.k8s.io/release/stable.txt)
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Configure kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" > ~/.kube/config

      - name: Ensure namespace exists
        run: |
          kubectl create namespace rikili001 --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Kubernetes secrets
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
        run: |
          kubectl create secret generic backend-secrets \
            --from-literal=SECRET_KEY="$DJANGO_SECRET_KEY" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=EMAIL_HOST_USER="$EMAIL_HOST_USER" \
            --from-literal=EMAIL_HOST_PASSWORD="$EMAIL_HOST_PASSWORD" \
            --from-literal=DEFAULT_FROM_EMAIL="$EMAIL_HOST_USER" \
            -n rikili001 \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply PostgreSQL manifests
        run: kubectl apply -f k8s/postgres.yaml

      - name: Record current images for rollback
        run: |
          mkdir -p rollback
          kubectl get deployment backend -n rikili001 -o jsonpath='{.spec.template.spec.containers[0].image}' > rollback/backend-image.txt || true
          kubectl get deployment frontend -n rikili001 -o jsonpath='{.spec.template.spec.containers[0].image}' > rollback/frontend-image.txt || true

      - name: Update image tags in manifests
        run: |
          sed -i "s|ravindudilhan/rebuild-backend:latest|ravindudilhan/rebuild-backend:${{ github.sha }}|g" k8s/backend.yaml
          sed -i "s|ravindudilhan/rebuild-frontend:latest|ravindudilhan/rebuild-frontend:${{ github.sha }}|g" k8s/frontend.yaml

      - name: Apply backend manifests
        run: kubectl apply -f k8s/backend.yaml

      - name: Apply frontend manifests
        run: kubectl apply -f k8s/frontend.yaml

      - name: Wait for application rollouts
        run: |
          kubectl rollout status deployment/backend -n rikili001 --timeout=180s
          kubectl rollout status deployment/frontend -n rikili001 --timeout=180s

      - name: Smoke test production frontend
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://rebuild-app.duckdns.org/

      - name: Apply ingress manifest
        run: kubectl apply -f k8s/ingress.yaml

      - name: Apply Grafana ingress manifest
        run: kubectl apply -f k8s/grafana-ingress.yaml
        
      - name: Apply Prometheus scrape config manifest
        run: kubectl apply -f k8s/prometheus-scrape-config.yaml

      - name: Roll back failed application rollout
        if: failure()
        run: |
          kubectl rollout undo deployment/backend -n rikili001 || true
          kubectl rollout undo deployment/frontend -n rikili001 || true

      - name: Upload rollback references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollback-images-${{ github.sha }}
          path: rollback/
          if-no-files-found: ignore
