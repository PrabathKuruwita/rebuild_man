services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: rebuild_db
    environment:
      POSTGRES_DB: rebuild_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin1234
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rebuild_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rebuild_network

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rebuild_backend
    environment:
      DEBUG: "True"
      SECRET_KEY: "django-insecure-3z55ai11+0pf5gb5_fb8g9^69zpj6e*3fvttevtwt9-6+j_k^e"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend,0.0.0.0,*"
      # PostgreSQL settings matching settings.py variable names
      DB_NAME: rebuild_db
      DB_USER: postgres
      DB_PASSWORD: admin1234
      DB_HOST: db
      DB_PORT: "5432"
      FRONTEND_URL: "http://localhost:3000"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rebuild_network
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://backend:8000
    container_name: rebuild_frontend
    environment:
      # Relative URL: browser calls /api/* on same host → Next.js rewrites to backend internally
      NEXT_PUBLIC_API_URL: "/api"
      BACKEND_URL: "http://backend:8000"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - rebuild_network
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:

networks:
  rebuild_network:
    driver: bridge
