services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: rebuild_db
    environment:
      POSTGRES_DB: ${DB_NAME:-rebuild_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?ERROR: DB_PASSWORD not set}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rebuild_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rebuild_network

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rebuild_backend
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:?ERROR: SECRET_KEY not set}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      # PostgreSQL settings matching settings.py variable names
      DB_NAME: ${DB_NAME:-rebuild_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?ERROR: DB_PASSWORD not set}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rebuild_network
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://backend:8000
    container_name: rebuild_frontend
    environment:
      # Relative URL: browser calls /api/* on same host → Next.js rewrites to backend internally
      NEXT_PUBLIC_API_URL: "/api"
      BACKEND_URL: "http://backend:8000"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - rebuild_network
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:

networks:
  rebuild_network:
    driver: bridge
